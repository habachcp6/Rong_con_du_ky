<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180" shape-rendering="crispEdges" data-pixel-art="true" data-alpha="false">
  <!-- Bright Sky -->
  <rect width="320" height="180" fill="#87ceeb"/>

  <!-- Sun -->
  <rect x="240" y="20" width="40" height="40" fill="#ffd166"/>

  <!-- Cloud -->
  <rect x="30" y="30" width="60" height="14" fill="#ffffff"/>
  <rect x="40" y="22" width="40" height="12" fill="#ffffff"/>

  <!-- Ocean - deep -->
  <rect y="85" width="320" height="30" fill="#1a7fa0"/>
  <!-- Waves -->
  <rect x="20" y="90" width="80" height="4" fill="#ffffff"/>
  <rect x="160" y="95" width="100" height="4" fill="#ffffff"/>

  <!-- Shore water -->
  <rect y="115" width="320" height="10" fill="#5ec4d6"/>

  <!-- Sandy beach -->
  <rect y="125" width="320" height="55" fill="#f0d68a"/>

  <!-- Single palm tree - clean silhouette -->
  <!-- Trunk -->
  <rect x="60" y="60" width="8" height="80" fill="#8b5e3c"/>
  <!-- Canopy - simple cross shape -->
  <rect x="20" y="45" width="80" height="16" fill="#2d8f5e"/>
  <rect x="40" y="36" width="50" height="14" fill="#2d8f5e"/>
  <rect x="55" y="52" width="30" height="12" fill="#2d8f5e"/>
</svg>
