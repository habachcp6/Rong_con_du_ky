<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180" shape-rendering="crispEdges" data-pixel-art="true" data-alpha="false">
  <!-- Night sky -->
  <rect width="320" height="180" fill="#0a1628"/>
  <!-- Stars -->
  <rect x="50" y="15" width="4" height="4" fill="#ffffff"/>
  <rect x="180" y="20" width="4" height="4" fill="#ffffff"/>
  <rect x="280" y="12" width="4" height="4" fill="#ffffff"/>

  <!-- River -->
  <rect y="110" width="320" height="70" fill="#0f2038"/>

  <!-- City lights on banks -->
  <rect x="10" y="75" width="12" height="25" fill="#ffd166"/>
  <rect x="30" y="80" width="10" height="20" fill="#ffd166"/>
  <rect x="280" y="72" width="14" height="28" fill="#ffd166"/>
  <rect x="300" y="78" width="10" height="22" fill="#ffd166"/>

  <!-- Bridge deck (left bank) -->
  <rect y="100" width="120" height="10" fill="#8a9aa2"/>
  <!-- Bridge deck (right bank) -->
  <rect x="200" y="100" width="120" height="10" fill="#8a9aa2"/>

  <!-- Central pivot pier -->
  <rect x="145" y="100" width="30" height="30" fill="#8a9aa2"/>

  <!-- Central tower (A-frame) -->
  <rect x="155" y="25" width="10" height="75" fill="#f47c48"/>
  <!-- Tower light -->
  <rect x="156" y="18" width="8" height="8" fill="#ffd166"/>

  <!-- Cable stays -->
  <rect x="120" y="55" width="36" height="3" fill="#ffd166"/>
  <rect x="110" y="72" width="46" height="3" fill="#ffd166"/>
  <rect x="164" y="55" width="36" height="3" fill="#ffd166"/>
  <rect x="164" y="72" width="46" height="3" fill="#ffd166"/>

  <!-- Ship passing through -->
  <rect x="135" y="118" width="50" height="14" fill="#f47c48"/>
  <rect x="145" y="112" width="25" height="8" fill="#ffffff"/>

  <!-- Water reflections -->
  <rect x="140" y="145" width="40" height="4" fill="#ffd166"/>
</svg>
