<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180" shape-rendering="crispEdges" data-pixel-art="true" data-alpha="false">
  <!-- Bright sky -->
  <rect width="320" height="180" fill="#87ceeb"/>

  <!-- Sun -->
  <rect x="260" y="15" width="30" height="30" fill="#ffd166"/>

  <!-- Ocean -->
  <rect y="130" width="320" height="50" fill="#1a7fa0"/>

  <!-- Peninsula mountain silhouette -->
  <rect x="0" y="80" width="200" height="55" fill="#2d7a4f"/>
  <rect x="30" y="60" width="120" height="40" fill="#2d7a4f"/>
  <rect x="60" y="45" width="60" height="25" fill="#2d7a4f"/>

  <!-- Jungle canopy (right side, foreground) -->
  <rect x="200" y="35" width="120" height="60" fill="#2d7a4f"/>
  <rect x="220" y="25" width="80" height="20" fill="#2d7a4f"/>
  <!-- Branch -->
  <rect x="200" y="95" width="120" height="10" fill="#8b5e3c"/>

  <!-- Voọc Chà Vá (bold, centered on branch) -->
  <!-- Body -->
  <rect x="235" y="65" width="30" height="30" fill="#1a2a3a"/>
  <!-- White beard collar -->
  <rect x="230" y="58" width="40" height="10" fill="#ffffff"/>
  <!-- Face -->
  <rect x="240" y="48" width="20" height="14" fill="#ffd166"/>
  <!-- Eyes -->
  <rect x="244" y="54" width="4" height="4" fill="#1a2a3a"/>
  <rect x="252" y="54" width="4" height="4" fill="#1a2a3a"/>
  <!-- Head crown -->
  <rect x="238" y="44" width="24" height="6" fill="#1a2a3a"/>
  <!-- Red legs -->
  <rect x="238" y="95" width="10" height="16" fill="#c75a3d"/>
  <rect x="252" y="95" width="10" height="16" fill="#c75a3d"/>
  <!-- White tail -->
  <rect x="260" y="90" width="6" height="35" fill="#ffffff"/>
</svg>
