<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180" shape-rendering="crispEdges" data-pixel-art="true" data-alpha="false">
  <!-- Dusky sky -->
  <rect width="320" height="180" fill="#1a2a3a"/>

  <!-- Mountain silhouette -->
  <rect x="0" y="45" width="200" height="100" fill="#2a4050"/>
  <rect x="20" y="25" width="120" height="35" fill="#2a4050"/>
  <rect x="180" y="55" width="140" height="90" fill="#2a4050"/>

  <!-- Workshop ground -->
  <rect y="145" width="320" height="35" fill="#8a9aa2"/>

  <!-- Workshop canopy -->
  <rect x="10" y="85" width="110" height="10" fill="#c75a3d"/>
  <!-- Canopy posts -->
  <rect x="20" y="95" width="8" height="50" fill="#1a2a3a"/>
  <rect x="100" y="95" width="8" height="50" fill="#1a2a3a"/>

  <!-- White marble statue (hero element) -->
  <rect x="170" y="115" width="80" height="30" fill="#8a9aa2"/> <!-- Pedestal -->
  <rect x="180" y="60" width="60" height="55" fill="#ffffff"/> <!-- Body -->
  <rect x="175" y="45" width="35" height="25" fill="#ffffff"/> <!-- Head -->
  <rect x="170" y="50" width="10" height="14" fill="#8a9aa2"/> <!-- Snout detail -->

  <!-- Artisan (left of statue) -->
  <rect x="130" y="100" width="20" height="30" fill="#c75a3d"/> <!-- Body -->
  <rect x="133" y="88" width="14" height="14" fill="#ffd166"/> <!-- Head -->
  <!-- Chisel arm -->
  <rect x="148" y="96" width="24" height="6" fill="#1a2a3a"/>

  <!-- Sparkle -->
  <rect x="168" y="80" width="6" height="6" fill="#ffd166"/>
  <rect x="160" y="72" width="4" height="4" fill="#ffffff"/>
</svg>
