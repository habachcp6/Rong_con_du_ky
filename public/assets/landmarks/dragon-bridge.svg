<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180" shape-rendering="crispEdges" data-pixel-art="true" data-alpha="false">
  <!-- Night Sky -->
  <rect width="320" height="180" fill="#0a1628"/>
  <!-- Stars -->
  <rect x="40" y="20" width="4" height="4" fill="#ffffff"/>
  <rect x="150" y="12" width="4" height="4" fill="#ffffff"/>
  <rect x="260" y="28" width="4" height="4" fill="#ffffff"/>

  <!-- River -->
  <rect y="120" width="320" height="60" fill="#162d50"/>
  <!-- Subtle wave -->
  <rect x="60" y="140" width="120" height="4" fill="#1e3a5f"/>
  <rect x="200" y="155" width="100" height="4" fill="#1e3a5f"/>

  <!-- Bridge Deck -->
  <rect y="108" width="320" height="12" fill="#162d50"/>

  <!-- Dragon Body - 3 clean arches -->
  <!-- Arch 1 (left) -->
  <rect x="20" y="88" width="60" height="20" fill="#ffd166"/>
  <rect x="35" y="76" width="30" height="16" fill="#ffd166"/>
  <!-- Arch 2 (center, tallest) -->
  <rect x="100" y="72" width="70" height="36" fill="#ffd166"/>
  <rect x="115" y="52" width="40" height="24" fill="#ffd166"/>
  <!-- Arch 3 (right) -->
  <rect x="190" y="80" width="50" height="28" fill="#ffd166"/>

  <!-- Dragon Head -->
  <rect x="240" y="60" width="40" height="40" fill="#ffd166"/>
  <rect x="260" y="50" width="24" height="14" fill="#f47c48"/> <!-- Horn/crest -->
  <rect x="250" y="68" width="8" height="8" fill="#0a1628"/> <!-- Eye -->
  <rect x="252" y="70" width="4" height="4" fill="#ffffff"/> <!-- Pupil -->

  <!-- Fire -->
  <rect x="280" y="56" width="20" height="20" fill="#f47c48"/>
  <rect x="300" y="52" width="16" height="28" fill="#e63946"/>

  <!-- Bridge reflection glow -->
  <rect x="100" y="122" width="80" height="6" fill="#ffd166"/>
  <rect x="240" y="126" width="60" height="4" fill="#f47c48"/>
</svg>
