<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180" shape-rendering="crispEdges" data-pixel-art="true" data-alpha="false">
  <!-- Misty sky -->
  <rect width="320" height="180" fill="#dceef4"/>
  <!-- Soft clouds -->
  <rect x="40" y="15" width="80" height="12" fill="#ffffff"/>
  <rect x="200" y="22" width="70" height="10" fill="#ffffff"/>

  <!-- Ground -->
  <rect y="150" width="320" height="30" fill="#4a8c6f"/>

  <!-- Peak 1 (far left, small) -->
  <rect x="10" y="100" width="50" height="55" fill="#5a7080"/>
  <rect x="20" y="80" width="30" height="25" fill="#5a7080"/>

  <!-- Peak 2 (left-mid) -->
  <rect x="55" y="85" width="50" height="70" fill="#3d5a6e"/>
  <rect x="65" y="65" width="30" height="25" fill="#3d5a6e"/>

  <!-- Peak 3 (center, tallest - Thủy Sơn) -->
  <rect x="115" y="55" width="90" height="100" fill="#5a7080"/>
  <rect x="135" y="30" width="50" height="30" fill="#5a7080"/>
  <!-- Cave entrance -->
  <rect x="145" y="110" width="30" height="40" fill="#1a2a3a"/>
  <!-- Pagoda on peak -->
  <rect x="152" y="80" width="26" height="6" fill="#c75a3d"/>
  <rect x="157" y="72" width="16" height="10" fill="#ffffff"/>
  <rect x="163" y="66" width="4" height="8" fill="#c75a3d"/>

  <!-- Peak 4 (right-mid) -->
  <rect x="200" y="80" width="55" height="75" fill="#3d5a6e"/>
  <rect x="215" y="60" width="30" height="25" fill="#3d5a6e"/>

  <!-- Peak 5 (far right, small) -->
  <rect x="260" y="95" width="50" height="60" fill="#5a7080"/>
  <rect x="272" y="78" width="26" height="22" fill="#5a7080"/>
</svg>
