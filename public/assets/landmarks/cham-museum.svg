<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180" shape-rendering="crispEdges" data-pixel-art="true" data-alpha="false">
  <!-- Warm sunset sky -->
  <rect width="320" height="180" fill="#3a1a30"/>

  <!-- Garden lawn -->
  <rect y="145" width="320" height="35" fill="#5a9a70"/>

  <!-- Museum main wall -->
  <rect x="50" y="60" width="220" height="85" fill="#f0d08a"/>

  <!-- Terracotta roof -->
  <rect x="40" y="50" width="240" height="12" fill="#c75a3d"/>
  <!-- Central gable -->
  <rect x="110" y="28" width="100" height="22" fill="#c75a3d"/>
  <rect x="145" y="20" width="30" height="10" fill="#ffd166"/> <!-- Spire -->

  <!-- Main entrance (dark arch) -->
  <rect x="135" y="80" width="50" height="65" fill="#3a1a30"/>
  <rect x="143" y="68" width="34" height="14" fill="#3a1a30"/>

  <!-- Side windows -->
  <rect x="70" y="78" width="24" height="30" fill="#3a1a30"/>
  <rect x="226" y="78" width="24" height="30" fill="#3a1a30"/>

  <!-- Cham sculpture (foreground left) -->
  <rect x="15" y="100" width="30" height="45" fill="#d4a060"/>
  <rect x="10" y="95" width="40" height="6" fill="#f0d08a"/>
  <!-- Carved detail silhouette -->
  <rect x="22" y="106" width="16" height="30" fill="#3a1a30"/>
</svg>
