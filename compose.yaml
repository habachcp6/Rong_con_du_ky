services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_USE_FIREBASE_EMULATORS: ${VITE_USE_FIREBASE_EMULATORS:-false}
        VITE_FIREBASE_AUTH_EMULATOR_URL: ${VITE_FIREBASE_AUTH_EMULATOR_URL-}
        VITE_FIREBASE_FIRESTORE_EMULATOR_HOST: ${VITE_FIREBASE_FIRESTORE_EMULATOR_HOST-}
        VITE_FIREBASE_FIRESTORE_EMULATOR_PORT: ${VITE_FIREBASE_FIRESTORE_EMULATOR_PORT-}
    image: rong-con-du-ky:local
    ports:
      - "8088:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-rong-con-du-ky}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      ALLOW_LOCAL_AUTH: "false"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:8080/api/health').then((r) => {
          if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
